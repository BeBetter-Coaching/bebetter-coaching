<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dossier · Living Memory Cockpit (design-lab)</title>
<style>
/* ─────────────────────────────────────────────────────────────────────────
   DESIGN-LAB — DOSSIER: LIVING MEMORY COCKPIT
   Andere cognitieve taak dan Workspace: niet "wat is er nu?" maar "wat is er
   over tijd veranderd, welke beslissingen zijn genomen, welke context verklaart
   het nu?". HERO = TIJD zelf: één levende MEMORY SPINE met een lichtgevende
   VANDAAG-kern waar de lijn samenkomt. Links = verleden (warm, herinnerd),
   kern = nu (draagt de dominante toon), rechts = toekomst (koel cyaan, gestippeld).
   Context zweeft als glas-lenzen om de tijdlijn — geen kolommen, geen kaartraster.
   Alleen echte view-model-velden (attention/changes/planning/domains/source_health);
   historie-capture staat in productie UIT → de eerlijke lege-staat is meegepresenteerd.
   ───────────────────────────────────────────────────────────────────────── */
@font-face{font-family:"Space Grotesk";src:url(/pwa/static/fonts/sg-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Space Grotesk";src:url(/pwa/static/fonts/sg-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Space Grotesk";src:url(/pwa/static/fonts/sg-700.woff2) format("woff2");font-weight:700;font-display:swap}
:root{
  --ds-canvas:#081527;--ds-text:#EAF2FF;--ds-text-2:#B4C7E6;--ds-text-3:#7F97BC;
  --ds-accent:#5EE6EB;--ds-accent-soft:rgba(94,230,235,.12);
  --ds-calm:#5EE6EB;--ds-calm-bg:rgba(94,230,235,.10);--ds-calm-bd:rgba(94,230,235,.36);
  --ds-attention:#F0A62B;--ds-attention-bg:rgba(240,166,43,.12);--ds-attention-bd:rgba(240,166,43,.46);
  --ds-critical:#F4744C;--ds-critical-bg:rgba(244,116,76,.14);--ds-critical-bd:rgba(244,116,76,.50);
  --ds-success:#37D9A2;--ds-success-bg:rgba(55,217,162,.10);--ds-success-bd:rgba(55,217,162,.38);
  --ds-stale:#8098BC;--ds-stale-bg:rgba(128,152,188,.10);--ds-stale-bd:rgba(128,152,188,.34);
  /* Dossier-signatuur: memory-warmth. Verleden = warm brons/amber (herinnerd),
     toekomst = koel cyaan (geprojecteerd). Encodeert past/now/future — geen decoratie. */
  --dc-mem:#EBA96A;         /* warm memory-brons */
  --dc-mem-2:#C98C55;       /* dieper verleden */
  --dc-future:#5EE6EB;      /* koele toekomst (cyaan) */
  --ds-1:4px;--ds-2:8px;--ds-3:12px;--ds-4:16px;--ds-5:20px;--ds-6:24px;--ds-8:32px;--ds-10:40px;
  --ds-r-sm:10px;--ds-r-md:14px;--ds-r-lg:18px;--ds-r-xl:22px;--ds-r-pill:999px;
  --ds-ease:cubic-bezier(.2,.7,.3,1);--ds-fast:120ms;--ds-base:200ms;--ds-slow:340ms;
  --tone:var(--ds-calm);--tone-bg:var(--ds-calm-bg);--tone-bd:var(--ds-calm-bd);
}
.is-calm{--tone:var(--ds-calm);--tone-bg:var(--ds-calm-bg);--tone-bd:var(--ds-calm-bd)}
.is-attention{--tone:var(--ds-attention);--tone-bg:var(--ds-attention-bg);--tone-bd:var(--ds-attention-bd)}
.is-critical{--tone:var(--ds-critical);--tone-bg:var(--ds-critical-bg);--tone-bd:var(--ds-critical-bd)}
.is-success{--tone:var(--ds-success);--tone-bg:var(--ds-success-bg);--tone-bd:var(--ds-success-bd)}
.is-stale{--tone:var(--ds-stale);--tone-bg:var(--ds-stale-bg);--tone-bd:var(--ds-stale-bd)}
*{box-sizing:border-box}
body{margin:0;background:
    radial-gradient(140% 100% at 50% -10%,#0b1f3d,#071129 55%,#03070f 100%),var(--ds-canvas);
  color:var(--ds-text);font-family:"Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  min-height:100vh;-webkit-font-smoothing:antialiased}

/* ── Shared DS primitives (lab-kopie) ───────────────────────────────────── */
.ds-label{font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--ds-text-3);margin:0}
.ds-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:var(--ds-r-pill);
  font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--tone);
  background:var(--tone-bg);border:1px solid var(--tone-bd);white-space:nowrap}
.ds-fresh{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--ds-text-3)}
.ds-fresh .dot{width:5px;height:5px;border-radius:50%;background:var(--tone);box-shadow:0 0 7px var(--tone)}
.num{font-variant-numeric:tabular-nums}

/* ── Scene shell ────────────────────────────────────────────────────────── */
.dc{position:relative;width:1440px;max-width:100%;margin:0 auto;min-height:900px;padding:26px 40px 0;overflow:hidden}

/* Header — kalm, één identiteit, huidige staat + versheid. Geen grote bol. */
.dc-top{position:relative;z-index:6;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:var(--ds-5);margin-bottom:6px}
.dc-id{display:flex;align-items:center;gap:14px;min-width:0}
.dc-mono{width:52px;height:52px;border-radius:15px;flex:0 0 auto;display:grid;place-items:center;
  font-size:16px;font-weight:700;letter-spacing:.04em;color:var(--ds-accent);
  background:radial-gradient(circle at 50% 24%,rgba(94,230,235,.18),transparent 60%),rgba(10,26,52,.6);
  border:1px solid rgba(94,230,235,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.dc-nm{margin:0;font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.05;text-wrap:balance}
.dc-meta{margin:3px 0 0;display:flex;align-items:center;gap:9px;font-size:12px;color:var(--ds-text-3)}
.dc-meta .sep{opacity:.4}
.dc-title{text-align:center}
.dc-title h1{margin:0;font-size:23px;font-weight:700;letter-spacing:-.01em;display:inline-flex;align-items:center;gap:11px}
.dc-title .badge{font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ds-accent);
  padding:4px 10px;border-radius:var(--ds-r-pill);border:1px solid rgba(94,230,235,.3);background:rgba(94,230,235,.07)}
.dc-title p{margin:4px 0 0;font-size:12.5px;color:var(--ds-text-3)}
.dc-actions{display:flex;align-items:center;justify-content:flex-end;gap:10px}
.dc-sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ds-text-2)}
.dc-sync .ok{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;
  color:var(--ds-success);background:rgba(55,217,162,.14);border:1px solid var(--ds-success-bd);font-size:11px}
.dc-sync b{font-weight:600;color:var(--ds-text)}.dc-sync small{display:block;color:var(--ds-text-3);font-size:10.5px}
.dc-btn{display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;
  color:var(--ds-text);padding:9px 15px;border-radius:var(--ds-r-pill);
  background:linear-gradient(180deg,rgba(24,52,98,.7),rgba(13,30,58,.6));border:1px solid rgba(122,168,255,.22);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.dc-btn.ic-only{padding:9px 11px}
.dc-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7}

/* ── Environment (Z0) ───────────────────────────────────────────────────── */
.dc-env{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.dc-haze{position:absolute;left:-14%;right:-14%;top:38%;height:340px;
  background:radial-gradient(60% 120% at 50% 50%,rgba(60,120,220,.10),transparent 72%);
  filter:blur(10px);animation:haze 26s ease-in-out infinite alternate}
@keyframes haze{from{transform:translateX(-18px)}to{transform:translateX(18px)}}
.dc-floor{position:absolute;left:0;right:0;bottom:-6%;height:52%;
  background:
    repeating-linear-gradient(90deg,transparent 0 118px,rgba(94,230,235,.05) 118px 119px),
    linear-gradient(180deg,transparent,rgba(94,230,235,.03));
  -webkit-mask-image:radial-gradient(72% 100% at 50% 0%,#000,transparent 74%);
          mask-image:radial-gradient(72% 100% at 50% 0%,#000,transparent 74%);
  transform:perspective(680px) rotateX(64deg);transform-origin:50% 0;opacity:.5}
.dc-orbits{position:absolute;inset:0;width:100%;height:100%}
.dc-orbits path{fill:none;stroke:rgba(94,230,235,.06);stroke-width:1}
.dc-orbits .star{fill:rgba(200,224,255,.5)}
.dc-vig{position:absolute;inset:0;background:radial-gradient(120% 82% at 50% 42%,transparent 52%,rgba(3,7,15,.6) 100%)}

/* ── Memory Spine SVG (Z1) — de temporele structuur ─────────────────────── */
.dc-scene{position:relative;height:660px;z-index:1}
.dc-spine{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.dc-spine .rail{fill:none;stroke-width:2.4;stroke-linecap:round}
.dc-spine .rail-glow{fill:none;stroke-width:8;stroke-linecap:round;filter:blur(7px);opacity:.5}
.dc-spine .rail-future{stroke:var(--dc-future);stroke-width:2;stroke-dasharray:2 9;stroke-linecap:round;opacity:.8;fill:none}
.dc-spine .tick{stroke:rgba(180,199,230,.22);stroke-width:1}
.dc-spine .conn{fill:none;stroke:var(--tone);stroke-width:1.3;opacity:.5}
.dc-spine .conn-dot{fill:var(--tone)}
.dc-origin{fill:none;stroke:var(--dc-mem-2);stroke-width:1.4;stroke-dasharray:1 7;stroke-linecap:round;opacity:.5}

/* Node glow halo (SVG) */
.nd-halo{filter:blur(6px)}

/* ── Node labels (HTML op de spine) ─────────────────────────────────────── */
.dc-nodes{position:absolute;inset:0;z-index:3;pointer-events:none}
.dc-node{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;
  width:210px;text-align:center}
.dc-node .lbl{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ds-text-3);
  font-variant-numeric:tabular-nums}
.dc-node .ttl{display:block;font-size:13px;font-weight:650;color:var(--ds-text);line-height:1.28;margin-top:2px;text-wrap:balance}
.dc-node .sig{display:block;font-size:11px;color:var(--ds-text-2);line-height:1.35;margin-top:2px}
.dc-node.past .ttl{color:#F0DFC8}
.dc-node.past .lbl{color:#B79167}
.dc-node.future .lbl{color:#78C7CF}.dc-node.future .ttl{color:#CFEFF2;font-weight:600}
.dc-node.dim{opacity:.42}
.dc-node.above{padding-bottom:52px}
.dc-node.below{padding-top:52px}
/* node dot marker rendered separately in SVG; label just floats */
.dc-node .cap{display:inline-flex;align-items:center;gap:5px;margin-top:5px;font-size:10px;color:var(--ds-text-3)}
.dc-node .cap i{width:4px;height:4px;border-radius:50%;background:var(--tone);flex:0 0 auto}

/* Vandaag core — de signatuur: pure lichtankerpunt (GEEN Workspace-metriek).
   De tijd komt hier samen; de dominante feit-lezing leeft in Actuele lijn + lenzen. */
.dc-core{position:absolute;transform:translate(-50%,-50%);z-index:4;text-align:center;pointer-events:auto;width:200px}
.dc-core .core-lbl{font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--ds-text);
  text-shadow:0 0 20px var(--tone-bg)}
.dc-core .core-date{font-size:11px;color:var(--ds-text-3);font-variant-numeric:tabular-nums;margin-top:2px}
.dc-core .core-orb{position:relative;width:96px;height:96px;margin:14px auto 12px}
.dc-core .core-chip{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:var(--tone);padding:4px 12px;border-radius:var(--ds-r-pill);
  background:var(--tone-bg);border:1px solid var(--tone-bd)}
.dc-core .core-chip i{width:5px;height:5px;border-radius:50%;background:var(--tone);box-shadow:0 0 8px var(--tone)}

/* ── Glass lenses (Z2) — context zweeft om de tijd ──────────────────────── */
.dc-lens{position:absolute;z-index:5;width:288px;padding:16px 18px 15px;border-radius:16px;
  background:linear-gradient(158deg,rgba(26,50,92,.5),rgba(12,26,50,.34) 58%,rgba(8,18,38,.16));
  border:1px solid rgba(130,170,240,.14);
  -webkit-backdrop-filter:blur(11px) saturate(1.05);backdrop-filter:blur(11px) saturate(1.05);
  box-shadow:inset 0 1px 0 rgba(192,217,255,.1),0 30px 60px -34px rgba(2,8,20,.95);
  -webkit-mask-image:linear-gradient(180deg,#000 84%,transparent 104%);
          mask-image:linear-gradient(180deg,#000 84%,transparent 104%)}
.dc-lens::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.05),transparent 24%)}
.dc-lens>*{position:relative}
.dc-lens .lh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:11px}
.dc-lens .lh b{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ds-text-2)}
.dc-lens .lh span{font-size:10px;color:var(--ds-text-3)}
.dc-row{display:flex;align-items:center;gap:10px;padding:7px 0}
.dc-row+.dc-row{border-top:1px solid rgba(255,255,255,.05)}
.dc-row .ic{width:24px;height:24px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;
  color:var(--rt,var(--ds-accent));background:color-mix(in srgb,var(--rt,var(--ds-accent)) 15%,transparent);
  border:1px solid color-mix(in srgb,var(--rt,var(--ds-accent)) 38%,transparent)}
.dc-row .ic svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8}
.dc-row .rb{flex:1;min-width:0}
.dc-row .rt{display:block;font-size:12.5px;font-weight:600;color:var(--ds-text);line-height:1.3}
.dc-row .rs{display:block;font-size:11px;color:var(--ds-text-3);margin-top:1px;overflow-wrap:anywhere}
.dc-row .rv{font-size:12.5px;font-weight:700;color:var(--rt,var(--ds-text));font-variant-numeric:tabular-nums;white-space:nowrap}
.dc-row .rv .arw{font-size:10px;margin-left:2px}
.dc-more{display:inline-flex;align-items:center;gap:5px;margin-top:11px;font-size:11.5px;font-weight:600;
  color:var(--ds-accent);cursor:pointer}
.dc-more svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.8}
.dc-quote{font-size:12px;color:var(--ds-text-2);line-height:1.5;font-style:italic;
  border-left:2px solid var(--tone-bd);padding-left:11px;margin:2px 0 0}

/* Actuele lijn — current-state anchor onder de kern */
.dc-nowline{position:absolute;z-index:5;left:50%;transform:translateX(-50%);width:520px;
  display:flex;align-items:center;gap:15px;padding:13px 20px;border-radius:16px;
  background:linear-gradient(180deg,rgba(15,32,60,.44),rgba(9,20,40,.3));border:1px solid rgba(122,168,255,.12);
  -webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px)}
.dc-nowline .pulse{width:38px;height:38px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;
  color:var(--tone);background:var(--tone-bg);border:1px solid var(--tone-bd)}
.dc-nowline .pulse svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}
.dc-nowline .nl-b{min-width:0}
.dc-nowline .nl-k{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ds-text-3)}
.dc-nowline .nl-t{font-size:14px;font-weight:600;color:var(--ds-text);line-height:1.35;margin-top:2px}
.dc-nowline .nl-t b{color:var(--tone);font-weight:700}
.dc-nowline .nl-s{font-size:11.5px;color:var(--ds-text-3);margin-top:1px}

/* ── Command bar (foreground) ───────────────────────────────────────────── */
.dc-cmd{position:relative;z-index:6;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:2px}
.dc-cmd .cmd{display:flex;align-items:center;gap:11px;padding:12px 20px;border-radius:14px;cursor:pointer;
  background:linear-gradient(180deg,rgba(18,40,76,.5),rgba(10,24,46,.4));border:1px solid rgba(122,168,255,.16);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.dc-cmd .cmd.lead{border-color:var(--tone-bd);background:linear-gradient(180deg,var(--tone-bg),rgba(10,24,46,.4))}
.dc-cmd .cmd .ci{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto;
  color:var(--ds-accent);background:rgba(94,230,235,.12);border:1px solid rgba(94,230,235,.3)}
.dc-cmd .cmd.lead .ci{color:var(--tone);background:var(--tone-bg);border-color:var(--tone-bd)}
.dc-cmd .cmd .ci svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8}
.dc-cmd .cmd .ct{text-align:left}
.dc-cmd .cmd .ct b{display:block;font-size:13px;font-weight:650;color:var(--ds-text)}
.dc-cmd .cmd .ct small{display:block;font-size:10.5px;color:var(--ds-text-3)}
.dc-cmd .spacer{width:1px;height:28px;background:rgba(122,168,255,.14);margin:0 4px}
.dc-cmd .cmd.round{padding:12px}

/* ── Source-health infra strip (low contrast) ───────────────────────────── */
.dc-infra{position:relative;z-index:5;display:flex;align-items:center;justify-content:center;gap:16px;
  margin-top:16px;padding-bottom:22px;font-size:10.5px;color:var(--ds-text-3)}
.dc-infra .s{display:inline-flex;align-items:center;gap:6px}
.dc-infra .s i{width:6px;height:6px;border-radius:50%;flex:0 0 auto}
.dc-infra .s.ok i{background:var(--ds-success)}.dc-infra .s.warn i{background:var(--ds-attention)}
.dc-infra .s.bad i{background:var(--ds-critical)}

/* ── Selected-event detail lens (foreground, spatial) ───────────────────── */
.dc-detail{position:absolute;z-index:8;left:50%;top:56%;transform:translate(-50%,-50%) scale(.96);
  width:440px;padding:22px 24px 20px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;
  background:linear-gradient(162deg,rgba(30,56,100,.62),rgba(11,26,50,.5) 60%,rgba(8,18,38,.4));
  border:1px solid var(--tone-bd);
  -webkit-backdrop-filter:blur(16px) saturate(1.1);backdrop-filter:blur(16px) saturate(1.1);
  box-shadow:0 40px 90px -30px rgba(2,8,20,.9),0 0 60px -20px var(--tone-bg),inset 0 1px 0 rgba(255,255,255,.1)}
.dc.sel .dc-detail{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.dc.sel .dc-lens,.dc.sel .dc-nowline,.dc.sel .dc-node:not(.is-sel){opacity:.28;transition:opacity .3s}
.dc.sel .dc-node.rel{opacity:1}
.dt-top{display:flex;align-items:flex-start;gap:13px;margin-bottom:14px}
.dt-ic{width:38px;height:38px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;color:var(--tone);
  background:var(--tone-bg);border:1px solid var(--tone-bd)}
.dt-ic svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8}
.dt-hd{flex:1;min-width:0}
.dt-when{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ds-text-3);font-variant-numeric:tabular-nums}
.dt-ttl{margin:2px 0 0;font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.dt-rel{font-size:10px;color:var(--ds-text-3);text-align:right;flex:0 0 auto}
.dt-rel b{display:block;color:var(--tone);font-size:12px}
.dt-close{position:absolute;top:16px;right:16px;width:28px;height:28px;border-radius:50%;cursor:pointer;
  display:grid;place-items:center;color:var(--ds-text-3);background:rgba(8,18,38,.5);border:1px solid rgba(122,168,255,.16)}
.dt-close svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2}
.dt-quote{font-size:13.5px;color:var(--ds-text);line-height:1.5;padding:12px 14px;border-radius:12px;margin:0 0 14px;
  background:rgba(6,16,34,.42);border-left:2px solid var(--tone-bd)}
.dt-sec{margin-top:13px}
.dt-sec .dt-k{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ds-text-3);margin-bottom:6px}
.dt-sec .dt-k svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.8;color:var(--tone)}
.dt-sec p{margin:0;font-size:12.5px;color:var(--ds-text-2);line-height:1.5}
.dt-sec ul{margin:0;padding:0;list-style:none;display:grid;gap:5px}
.dt-sec li{font-size:12px;color:var(--ds-text-2);line-height:1.45;padding-left:15px;position:relative}
.dt-sec li::before{content:"";position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%;background:var(--tone);opacity:.7}
.dt-prov{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;padding-top:13px;border-top:1px solid rgba(255,255,255,.07)}
.dt-prov .pv{font-size:10.5px;color:var(--ds-text-3);padding:3px 9px;border-radius:var(--ds-r-pill);
  background:rgba(10,24,48,.5);border:1px solid rgba(122,168,255,.14)}
.dt-why{margin-top:13px;font-size:11.5px;font-weight:600;color:var(--ds-accent);cursor:pointer;
  display:inline-flex;align-items:center;gap:6px}
.dt-why svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.8}

/* ── Empty / low-history honest state ───────────────────────────────────── */
.dc-l-empty .en-row{display:flex;gap:11px;align-items:flex-start}
.dc-l-empty .en-ic{width:22px;height:22px;flex:0 0 auto;fill:none;stroke:var(--ds-text-3);stroke-width:1.7;margin-top:1px}
.dc-l-empty .en-row p{margin:0;font-size:12px;color:var(--ds-text-2);line-height:1.55}
.dc-l-empty .en-row p b{color:var(--ds-text)}

/* ── Evidence shelf (subordinate) ───────────────────────────────────────── */
.dc-shelf{position:relative;z-index:5;display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:4px;padding:0 40px}
.dc-chip2{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:var(--ds-r-pill);cursor:pointer;
  font-size:11.5px;color:var(--ds-text-2);background:rgba(11,26,50,.42);border:1px solid rgba(122,168,255,.12)}
.dc-chip2 .cn{width:16px;height:16px;border-radius:5px;display:grid;place-items:center;color:var(--ds-text-3);
  background:rgba(94,230,235,.08)}
.dc-chip2 .cn svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:1.9}
.dc-chip2 b{color:var(--ds-text);font-weight:600}
.dc-chip2.empty{opacity:.5}

/* ── Board switcher (lab only) ──────────────────────────────────────────── */
.lab-nav{position:fixed;bottom:12px;left:12px;z-index:50;display:flex;gap:6px;
  padding:5px;border-radius:var(--ds-r-pill);background:rgba(6,14,30,.8);border:1px solid rgba(122,168,255,.2)}
.lab-nav a{font-size:11px;color:var(--ds-text-3);text-decoration:none;padding:6px 13px;border-radius:var(--ds-r-pill)}
.lab-nav a.on{color:var(--ds-canvas);background:var(--ds-accent);font-weight:700}

/* ── Motion — de tijd settelt van kern naar buiten ──────────────────────── */
@keyframes drawrail{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes fadeup{from{opacity:0;transform:translate(-50%,-46%)}to{opacity:1;transform:translate(-50%,-50%)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes coreBloom{0%{transform:translate(-50%,-50%) scale(.7);opacity:0}60%{opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.9;transform:scale(1.06)}}
.dc-core{animation:coreBloom .8s var(--ds-ease) both}
.dc-node{animation:fadeup .5s var(--ds-ease) both}
.dc-lens,.dc-nowline{animation:fadein .55s var(--ds-ease) both}
.corepulse{animation:pulse 3.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){
  .dc-core,.dc-node,.dc-lens,.dc-nowline{animation:none}
  .corepulse,.dc-haze{animation:none}
  .rail-draw{stroke-dashoffset:0!important}
}
</style>
</head>
<body>
<nav class="lab-nav">
  <a href="#overview" data-b="overview">Overzicht</a>
  <a href="#selected" data-b="selected">Geselecteerd</a>
  <a href="#empty" data-b="empty">Lege staat</a>
</nav>
<div id="root"></div>

<script>
const NS="http://www.w3.org/2000/svg";
// ── Icons (inline, stroke) ──────────────────────────────────────────────────
const IC={
  alert:'<path d="M12 3l9 16H3z"/><path d="M12 10v4"/><path d="M12 17h.01"/>',
  pulse:'<path d="M3 12h4l2-6 4 12 2-6h6"/>',
  flag:'<path d="M5 21V4h11l-2 4 2 4H5"/>',
  cal:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>',
  trend:'<path d="M3 17l6-6 4 4 8-8"/><path d="M21 7v5h-5"/>',
  note:'<path d="M5 3h10l4 4v14H5z"/><path d="M15 3v4h4"/><path d="M9 12h6M9 16h4"/>',
  chat:'<path d="M4 5h16v11H9l-5 4z"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  moon:'<path d="M20 14A8 8 0 019.5 4 8.5 8.5 0 1020 14z"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>',
  share:'<circle cx="6" cy="12" r="2.5"/><circle cx="17" cy="6" r="2.5"/><circle cx="17" cy="18" r="2.5"/><path d="M8.2 11L15 7M8.2 13L15 17"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  book:'<path d="M4 5a2 2 0 012-2h13v18H6a2 2 0 01-2-2z"/><path d="M19 3v18"/>',
  arw:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  dots:'<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
  heart:'<path d="M12 20S4 14 4 8.5A3.5 3.5 0 0112 6a3.5 3.5 0 018 2.5C20 14 12 20 12 20z"/>',
  spark:'<path d="M12 3v6M12 15v6M3 12h6M15 12h6"/>',
};
const svg=(p,c)=>`<svg viewBox="0 0 24 24" class="${c||''}">${IC[p]||''}</svg>`;

// ── Masja-snapshot (kritiek) — vorm exact als het view-model ────────────────
const DATA={
  naam:"Masja Bolk", groep:"5. Comfort", mono:"MB", overall:"Aandacht", tone:"is-critical",
  fresh:"zojuist gesynchroniseerd",
  // NU: attention + load_observation
  core:{ metric:"+200", unit:"%", cap:"Belasting fors boven referentie — herstel bewaken." },
  // Spine nodes: past = changes[] (echt gedateerd), future = planning (gestippeld)
  nodes:[
    {t:-4, cls:"past", pos:"below", lbl:"24 aug", ttl:"Kuit links gevoelig", sig:"na 18 km duurloop",
     tone:"is-attention", ic:"alert", rel:true,
     detail:{quote:"Kuit links blijft gevoelig na een lange duurloop.",
       changed:"Klacht kwam terug — eerder gemeld, nu opnieuw actief.",
       why:"Vergroot risico op overbelasting en remt adaptatie.",
       facts:["Domein: gezondheid & klachten","Status: recent gemeld"],
       prov:["atleet-gemeld","fs.training_log","24 aug","actief"]}},
    {t:-3, cls:"past", pos:"above", lbl:"25 aug", ttl:"Feedback na duurloop", sig:"vermoeidheid hoog",
     tone:"is-attention", ic:"chat", rel:false,
     detail:{quote:"Zwaar, vooral laatste 5 km. Kuit voelbaar.",
       changed:"Ervaren inspanning richting zwaarder.",why:"Signaal voor herstelbewaking.",
       facts:["Domein: herstel & leefritme"],prov:["atleet-gemeld","fs.training_log","25 aug"]}},
    {t:-2, cls:"past", pos:"below", lbl:"27 aug", ttl:"Trainingsonderbreking", sig:"2 dagen rust",
     tone:"is-stale", ic:"clock", rel:true,
     detail:{quote:"",changed:"Belasting piek vervroegd; herstel tussen blokken onvoldoende.",
       why:"Kan kuitbelasting en vermoeidheid raken.",facts:["Domein: belastbaarheid","Bron: afgeleid"],
       prov:["afgeleid","state","27 aug"]}},
    {t:0, core:true},
    {t:2, cls:"future", pos:"above", lbl:"schema", ttl:"Schema-blok loopt", sig:"nog 12 dagen",
     tone:"is-calm", ic:"cal", rel:false,
     detail:{quote:"",changed:"Actief opbouwblok richting hoofddoel.",why:"Bepaalt de komende belasting.",
       facts:["18 aug → 12 sep","Uitvoerwijze: afstand (km)"],prov:["afgeleid","intake","laatst geconfigureerd"]}},
    {t:4, cls:"future", pos:"below", lbl:"05 okt", ttl:"7-Heuvelenloop", sig:"hoofddoel · 15 km",
     tone:"is-calm", ic:"flag", rel:true,
     detail:{quote:"",changed:"Wedstrijddatum staat vast.",why:"Doelrealisatie in gevaar bij aanhoudende overbelasting.",
       facts:["Race-prioriteit: hoog","Afstand: 15 km"],prov:["coach-gemeld","intake","hoofddoel"]}},
  ],
  // Lenzen
  changes:[  // LAATSTE VERANDERINGEN — uit _changes()
    {ic:"alert",tone:"is-attention",t:"Klacht kuit: recent gemeld",v:"24 aug"},
    {ic:"clock",tone:"is-stale",t:"Trainingsonderbreking",v:"27 aug"},
    {ic:"trend",tone:"is-attention",t:"Ervaren inspanning zwaarder",v:"trend"},
  ],
  signals:[  // KLACHTEN & SIGNALEN — uit _attention()
    {ic:"pulse",tone:"is-critical",t:"Verhoogd belastingssignaal",s:"volume +200% t.o.v. referentie",v:"hoog"},
    {ic:"alert",tone:"is-attention",t:"Kuit links — actief",s:"gevoelig na lange duurloop",v:"2/10"},
  ],
  goals:[  // DOELEN & BESLISSINGEN — uit planning.rows
    {ic:"flag",tone:"is-success",t:"7-Heuvelenloop",s:"hoofddoel · opbouw richting 15 km",v:"05 okt"},
    {ic:"cal",tone:"is-calm",t:"Schema-blok",s:"18 aug → 12 sep · afstand (km)",v:"loopt"},
  ],
  coach:[  // COACHKENNIS — uit domains 'coach'
    {q:"Reageert goed op rustige opbouw; niet forceren na klachtsignaal."},
    {q:"Kuithistorie: eerder gevoelig bij snelle volumesprongen."},
  ],
  nowline:{ k:"Actuele lijn", t:"Belasting <b>fors verhoogd</b>, kuit links gevoelig", s:"Focus: gecontroleerd herstel richting 7-Heuvelenloop" },
  domains:[
    {ic:"pulse",t:"Belastbaarheid",n:6},{ic:"heart",t:"Gezondheid & klachten",n:3},
    {ic:"moon",t:"Herstel & leefritme",n:4},{ic:"target",t:"Doelen & agenda",n:3},
    {ic:"spark",t:"Profiel & voorkeuren",n:2},{ic:"book",t:"Coachkennis",n:5},
  ],
  sources:[{n:"Trainingslog",c:"ok",s:"vers"},{n:"Intake",c:"ok",s:"vers"},{n:"Garmin-herstel",c:"warn",s:"verouderd"}],
};

// geometry: spine curve, node x by time-index
const W=1440, SCENE_H=660;
const coreX=724, xStep=152;                    // px per tijd-stap
const xOf=t=>coreX + t*xStep;
const yOf=x=>452 - 30*Math.sin(Math.max(0,Math.min(1,(x-96)/1252))*Math.PI); // shallow arc

function railPath(x0,x1){
  let d=`M${x0.toFixed(1)} ${yOf(x0).toFixed(1)}`;
  for(let x=x0+18;x<=x1;x+=18) d+=` L${x.toFixed(1)} ${yOf(x).toFixed(1)}`;
  d+=` L${x1.toFixed(1)} ${yOf(x1).toFixed(1)}`;
  return d;
}

function build(state){
  const empty = state==="empty";
  const nodes = empty
    ? DATA.nodes.filter(n=>n.core || n.cls==="future")   // lege staat: geen past-changes
    : DATA.nodes;

  const pastX0 = xOf(-4.3), futureX1 = xOf(4.7);
  const railNowX = coreX;

  // ── environment ──
  const orbits=`<svg class="dc-orbits" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <path d="M-40 470 C300 400 800 400 1480 460"/><path d="M-40 560 C360 500 900 500 1480 540"/>
    <path d="M120 -40 C240 220 300 420 300 780"/><path d="M1320 -40 C1230 240 1160 460 1150 820"/>
    ${[[150,120,1.3],[430,70,1],[900,54,1.3],[1230,120,1],[1330,420,1.2],[90,470,1.1],[240,800,1.2],[1150,780,1.1],[650,110,.9],[1050,240,1],[340,300,.9],[1290,640,1]]
      .map((s,i)=>`<circle class="star${i%4===2?' tw':''}" cx="${s[0]}" cy="${s[1]}" r="${s[2]}" opacity="${.2+ (i%3)*.08}"/>`).join('')}
  </svg>`;

  // ── spine svg ──
  let sp=`<svg class="dc-spine" viewBox="0 0 ${W} ${SCENE_H}" aria-hidden="true">
    <defs>
      <linearGradient id="railg" x1="0" x2="1">
        <stop offset="0" stop-color="var(--dc-mem-2)" stop-opacity="${empty?'.35':'.85'}"/>
        <stop offset="${(railNowX-pastX0)/(futureX1-pastX0)}" stop-color="var(--tone)" stop-opacity=".95"/>
        <stop offset="1" stop-color="var(--dc-future)" stop-opacity="0"/>
      </linearGradient>
      <radialGradient id="coreg" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
        <stop offset="22%" stop-color="var(--tone)" stop-opacity=".95"/>
        <stop offset="60%" stop-color="var(--tone)" stop-opacity=".22"/>
        <stop offset="100%" stop-color="var(--tone)" stop-opacity="0"/>
      </radialGradient>
    </defs>`;
  // origin tail (honest history-begins-here)
  sp+=`<path class="dc-origin" d="${railPath(xOf(-5.6), pastX0)}"/>`;
  // memory (past) + now glow
  sp+=`<path class="rail-glow" style="stroke:var(--tone)" d="${railPath(pastX0, railNowX)}" opacity="${empty?'.2':'.5'}"/>`;
  sp+=`<path class="rail rail-draw" stroke="url(#railg)" d="${railPath(pastX0, railNowX+2)}"/>`;
  // future dashed
  sp+=`<path class="rail-future" d="${railPath(railNowX, futureX1)}"/>`;
  // segment ticks under each node
  nodes.forEach(n=>{ if(n.core)return; const x=xOf(n.t),y=yOf(x);
    sp+=`<line class="tick" x1="${x}" y1="${y-7}" x2="${x}" y2="${y+7}"/>`; });
  // core bloom (behind html core) — pure light-anchor: outer bloom + ring + bright center
  const ccy=yOf(coreX);
  sp+=`<circle cx="${coreX}" cy="${ccy}" r="88" fill="url(#coreg)" class="corepulse" style="transform-origin:${coreX}px ${ccy}px"/>`;
  sp+=`<circle cx="${coreX}" cy="${ccy}" r="30" fill="none" stroke="var(--tone)" stroke-width="1" opacity=".35"/>`;
  sp+=`<circle cx="${coreX}" cy="${ccy}" r="18" fill="none" stroke="var(--tone)" stroke-width="1.4" opacity=".6"/>`;
  sp+=`<circle cx="${coreX}" cy="${ccy}" r="6.5" fill="#fff"/><circle cx="${coreX}" cy="${ccy}" r="13" fill="${toneColor(DATA.tone)}" opacity=".35" class="nd-halo"/>`;
  // node dots
  nodes.forEach(n=>{ if(n.core)return; const x=xOf(n.t),y=yOf(x);
    const r = n.cls==="future"?4.5:(n.rel?6:5);
    const fut=n.cls==="future";
    sp+=`<circle cx="${x}" cy="${y}" r="${r+5}" fill="var(--tone)" class="nd-halo n-${n.tone}" style="opacity:.5"/>`.replace('var(--tone)', toneColor(n.tone));
    sp+= fut
      ? `<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="var(--dc-future)" stroke-width="2"/><circle cx="${x}" cy="${y}" r="1.6" fill="var(--dc-future)"/>`
      : `<circle cx="${x}" cy="${y}" r="${r}" fill="${toneColor(n.tone)}" stroke="rgba(255,255,255,.5)" stroke-width="1"/>`;
  });
  // connectors from lenses to relevant nodes (subtle)
  const conn=(lx,ly,nx,ny,tone)=>{ const c1x=lx+(nx-lx)*.5, mid=(ly+ny)/2;
    sp+=`<path class="conn n-${tone}" style="stroke:${toneColor(tone)}" d="M${lx} ${ly} C${c1x} ${ly} ${c1x} ${ny} ${nx} ${ny}"/><circle class="conn-dot" cx="${nx}" cy="${ny}" r="2.6" style="fill:${toneColor(tone)}"/>`;
  };
  if(!empty){
    conn(330,196, xOf(-4), yOf(xOf(-4))+13, "is-attention");   // changes→kuit
    conn(1112,214, xOf(4), yOf(xOf(4))+13, "is-success");      // goals? actually top-right signals
  }
  sp+=`</svg>`;

  // ── node labels ──
  let nl=`<div class="dc-nodes">`;
  nodes.forEach((n,i)=>{ if(n.core)return; const x=xOf(n.t),y=yOf(x);
    const ty = n.pos==="above" ? y-58 : y+58;
    nl+=`<div class="dc-node ${n.cls} ${n.pos} ${n.tone} ${n.rel?'rel':''}" data-i="${i}" style="left:${x}px;top:${ty}px">
      <span class="lbl">${n.lbl}</span><span class="ttl">${n.ttl}</span><span class="sig">${n.sig}</span></div>`;
  });
  nl+=`</div>`;

  // ── core (html) — pure lichtankerpunt, geen groot getal ──
  const cy=yOf(coreX);
  const core=`<div class="dc-core ${DATA.tone}" style="left:${coreX}px;top:${cy}px">
    <div class="core-lbl">Vandaag</div><div class="core-date num">31 aug</div>
    <div class="core-orb"></div>
    <div class="core-chip"><i></i>${DATA.overall}</div>
  </div>`;

  // ── lenses ──
  const rowsChanges = DATA.changes.map(r=>row(r)).join("");
  const rowsSignals = DATA.signals.map(r=>row(r)).join("");
  const rowsGoals   = DATA.goals.map(r=>row(r)).join("");
  const coachQ = DATA.coach.map(c=>`<p class="dc-quote">${c.q}</p>`).join("");

  let lenses="";
  if(!empty){
    lenses+=lens("dc-l-changes", 40, 150, "Laatste veranderingen","sinds 24 aug", rowsChanges, "Alle veranderingen");
    lenses+=lens("dc-l-signals", 1112, 150, "Klachten &amp; signalen","actueel beeld", rowsSignals, "Alle signalen");
    lenses+=lens("dc-l-goals", 40, 470, "Doelen &amp; beslissingen","koers", rowsGoals, "Alle doelen");
    lenses+=lens("dc-l-coach", 1112, 470, "Coachkennis","context", coachQ, "Volledig dossier");
  } else {
    // Lege staat: alléén wat NU echt bekend is (huidige staat + doelen + coach) + eerlijke
    // uitleg dat de historie vanaf-nu wordt opgebouwd. Geen verzonnen tijdlijn-knopen.
    lenses+=`<div class="dc-lens dc-l-empty" style="left:40px;top:150px">
      <div class="lh"><b>Geheugenlijn</b><span>bouwt op</span></div>
      <div class="en-row">${svg('clock','en-ic')}<p>De longitudinale historie wordt <b>vanaf nu</b> opgebouwd. ‘Geen events’ betekent hier niet ‘geen historie’ — alleen dat er nog niets is vastgelegd.</p></div>
      <div class="dc-more">Zo werkt het geheugen ${svg('arw')}</div></div>`;
    lenses+=lens("dc-l-signals", 1112, 150, "Klachten &amp; signalen","actueel beeld",
      `<div class="dc-row" style="--rt:var(--ds-success)"><div class="ic">${svg('heart')}</div><div class="rb"><span class="rt">Geen actieve klacht</span><span class="rs">geen open signaal — bronnen vers</span></div></div>`, "");
    lenses+=lens("dc-l-goals", 40, 470, "Doelen &amp; beslissingen","koers", rowsGoals, "Alle doelen");
    lenses+=lens("dc-l-coach", 1112, 470, "Coachkennis","context", coachQ, "Volledig dossier");
  }

  // ── nowline ──
  const nowline = `<div class="dc-nowline ${DATA.tone}" style="top:${cy+150}px">
    <div class="pulse">${svg('pulse')}</div>
    <div class="nl-b"><div class="nl-k">${DATA.nowline.k}</div>
      <div class="nl-t">${empty? "Actuele staat bekend · geen open klacht" : DATA.nowline.t}</div>
      <div class="nl-s">${empty? "Doel &amp; planning vastgelegd — historie bouwt op" : DATA.nowline.s}</div></div>
  </div>`;

  // ── selected-event detail ──
  const selNode = DATA.nodes.find(n=>!n.core && n.cls==="past") || DATA.nodes[0];
  const d=selNode.detail;
  const detail = `<div class="dc-detail ${selNode.tone}">
    <div class="dt-close" onclick="location.hash='#overview'">${svg('x')}</div>
    <div class="dt-top"><div class="dt-ic">${svg(selNode.ic)}</div>
      <div class="dt-hd"><div class="dt-when num">${selNode.lbl} · analyse</div><h3 class="dt-ttl">${selNode.ttl}</h3></div>
      <div class="dt-rel">Relevantie<b>Hoog</b></div></div>
    ${d.quote?`<p class="dt-quote">"${d.quote}"</p>`:""}
    <div class="dt-sec"><div class="dt-k">${svg('pulse')}Wat veranderde</div><p>${d.changed}</p></div>
    <div class="dt-sec"><div class="dt-k">${svg('target')}Waarom relevant</div><p>${d.why}</p></div>
    <div class="dt-sec"><div class="dt-k">${svg('book')}Onderbouwing</div><ul>${d.facts.map(f=>`<li>${f}</li>`).join("")}</ul></div>
    <div class="dt-prov">${d.prov.map(p=>`<span class="pv">${p}</span>`).join("")}</div>
    <div class="dt-why">${svg('spark')}Volledige provenance-keten</div>
  </div>`;

  // ── evidence shelf + infra ──
  const shelf=`<div class="dc-shelf">${DATA.domains.map(dm=>`<span class="dc-chip2 ${dm.n?'':'empty'}"><span class="cn">${svg(dm.ic)}</span><b>${dm.t}</b> ${dm.n||'—'}</span>`).join("")}</div>`;
  const infra=`<div class="dc-infra">${DATA.sources.map(s=>`<span class="s ${s.c}"><i></i>${s.n}: ${s.s}</span>`).join("")}</div>`;

  // ── command bar ──
  const cmd=`<div class="dc-cmd">
    <div class="cmd lead ${DATA.tone}"><div class="ci">${svg('plus')}</div><div class="ct"><b>Notitie toevoegen</b><small>leg iets vast</small></div></div>
    <div class="cmd"><div class="ci">${svg('cal')}</div><div class="ct"><b>Naar schema</b><small>pas plan aan</small></div></div>
    <div class="cmd"><div class="ci">${svg('book')}</div><div class="ct"><b>Volledig dossier</b><small>alle kennis</small></div></div>
    <div class="spacer"></div>
    <div class="cmd round"><div class="ci">${svg('dots')}</div></div>
  </div>`;

  return `<div class="dc ${state==='selected'?'sel':''} ${DATA.tone}">
    <div class="dc-env"><div class="dc-haze"></div><div class="dc-floor"></div>${orbits}<div class="dc-vig"></div></div>
    <header class="dc-top">
      <div class="dc-id"><span class="dc-mono">${DATA.mono}</span>
        <div><h2 class="dc-nm">${DATA.naam}</h2>
          <p class="dc-meta">${DATA.groep}<span class="sep">·</span><span class="ds-chip ${DATA.tone}">${DATA.overall}</span>
            <span class="ds-fresh"><i class="dot"></i>${DATA.fresh}</span></p></div></div>
      <div class="dc-title"><h1>Dossier <span class="badge">Levend geheugen</span></h1>
        <p>Wat veranderde, wanneer &amp; waarom het ertoe doet</p></div>
      <div class="dc-actions">
        <div class="dc-sync"><span class="ok">✓</span><div><b>Dossier actueel</b><small>laatst gesynchroniseerd: zojuist</small></div></div>
        <div class="dc-btn">${svg('share')} Delen</div>
      </div>
    </header>
    <div class="dc-scene">${sp}${nl}${core}${lenses}${nowline}${detail}</div>
    ${shelf}
    ${cmd}
    ${infra}
  </div>`;
}

function toneColor(t){return{
  "is-calm":"#5EE6EB","is-attention":"#F0A62B","is-critical":"#F4744C",
  "is-success":"#37D9A2","is-stale":"#8098BC"}[t]||"#5EE6EB";}

function row(r){
  return `<div class="dc-row" style="--rt:${toneColor(r.tone)}">
    <div class="ic">${svg(r.ic)}</div>
    <div class="rb"><span class="rt">${r.t}</span>${r.s?`<span class="rs">${r.s}</span>`:""}</div>
    <span class="rv">${r.v||""}</span></div>`;
}
function lens(cls,x,y,title,sub,body,more){
  return `<div class="dc-lens ${cls}" style="left:${x}px;top:${y}px">
    <div class="lh"><b>${title}</b><span>${sub}</span></div>${body}
    ${more?`<div class="dc-more">${more} ${svg('arw')}</div>`:""}</div>`;
}

function render(){
  const h=(location.hash||"#overview").slice(1);
  const state=["overview","selected","empty"].includes(h)?h:"overview";
  document.getElementById("root").innerHTML=build(state);
  document.querySelectorAll(".lab-nav a").forEach(a=>a.classList.toggle("on",a.dataset.b===state));
  // click node → selected
  document.querySelectorAll(".dc-node").forEach(n=>n.addEventListener("click",()=>{location.hash="#selected";}));
}
window.addEventListener("hashchange",render);
render();
</script>
</body>
</html>
