<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feedback prod harness</title>
<link rel="stylesheet" href="/pwa/static/styles.css">
<link rel="stylesheet" href="/pwa/static/design-system.css">
<style>
  @font-face{font-family:"Space Grotesk";src:url(/pwa/static/fonts/sg-400.woff2) format("woff2");font-weight:400}
  @font-face{font-family:"Space Grotesk";src:url(/pwa/static/fonts/sg-700.woff2) format("woff2");font-weight:700}
  body{margin:0!important;display:block!important;max-width:none!important;grid-template-columns:none!important;
    background:radial-gradient(140% 100% at 50% -10%,#0b1f3d,#071129 55%,#03070f 100%),#081527;
    color:#EAF2FF;font-family:"Space Grotesk",system-ui,sans-serif;overflow:auto!important}
  .frame{margin:0 auto;padding:0 30px}
  .hl{position:fixed;top:6px;left:6px;z-index:99;font-size:11px;color:#7F97BC;background:rgba(6,14,30,.8);padding:3px 9px;border-radius:99px}
</style>
</head>
<body>
<div class="hl" id="hl">laden…</div>
<div id="mount"></div>
<svg width="0" height="0" style="position:absolute"><defs id="sprite"></defs></svg>
<script>
const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>[...(r||document).querySelectorAll(s)];
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ic=n=>`<svg class="ic"><use href="#ic-${n}"/></svg>`;
function initialen(n){return String(n||"").split(/\s+/).map(w=>w[0]||"").join("").slice(0,2).toUpperCase();}
const _DS_TONE={hoog:"is-critical",let_op:"is-attention",aandacht:"is-attention",critical:"is-critical",attention:"is-attention",calm:"is-calm",success:"is-success",red:"is-critical",amber:"is-attention",green:"is-calm",unknown:"is-unknown",stale:"is-stale"};
function dsTone(v){return _DS_TONE[String(v==null?"":v).toLowerCase()]||"is-calm";}
function dsChip(t,tone){return `<span class="ds-chip ${tone||'is-calm'}">${esc(t)}</span>`;}
function dsFresh(s,t){return `<span class="ds-fresh ${dsTone(s)}"><i class="ds-dot"></i>${esc(t)}</span>`;}
function nlNum(x){if(x==null||x==="")return "";const n=Number(x);return isFinite(n)?(Math.round(n*100)/100).toString().replace(".",","):String(x);}
// shims for flow/deps we don't render
const renderGroupsBar=()=>{}, fbLog=()=>{}, fbBindDock=()=>{}, fbScrollThreadBottom=()=>{}, fbLockQueue=()=>{},
  isDesktop=()=>innerWidth>=1100, melding=()=>{}, haptic=()=>{}, openAthleteModule=()=>{}, api=()=>Promise.resolve(null),
  renderFocusSkeleton=()=>{}, fbPreloadNext=()=>{}, fbKbOpen=()=>{}, fbKbClose=()=>{}, fbGrow=()=>{}, fbBindPrimary=()=>{}, fbLoadContext=()=>{},
  fbDraftGet=id=>SAMPLE.draft||"", fbDraftSave=()=>{}, homeFbBijwerken=()=>{}, fbUpdateInfo=()=>{}, fbToast=()=>{}, fbSummaryUpdate=()=>{};
function fbDateLabel(d){const t=new Date().toISOString().slice(0,10);if(d===t)return "Vandaag";const m=String(d).match(/(\d{4})-(\d{2})-(\d{2})/);const mn=["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];return m?`${+m[3]} ${mn[+m[2]-1]}`:d;}
function fbLocalISO(){return SAMPLE.today;}

async function loadSprite(){const t=await (await fetch("/pwa/static/index.html")).text();const m=t.match(/<defs>([\s\S]*?)<\/defs>/);if(m)$("#sprite").innerHTML=m[1];}
// Extract named functions/consts from app.js by brace/lparen matching and eval them.
function sliceFn(src,decl){const i=src.indexOf(decl);if(i<0)throw new Error("niet gevonden: "+decl);const j=src.indexOf("{",i);let d=0;for(let k=j;k<src.length;k++){if(src[k]==="{")d++;else if(src[k]==="}"){d--;if(d===0)return src.slice(i,k+1);}}throw new Error("unbalanced "+decl);}
function sliceConst(src,name){const i=src.indexOf(name);const j=src.indexOf(";",i);return src.slice(i,j+1);}
async function loadFns(){
  const t=await (await fetch("/pwa/static/app.js")).text();
  let code="";
  ["const FB_CAT","const _FB_TABS"].forEach(c=>code+=sliceConst(t,c)+"\n");
  ["function fbIsoWeek(","function fbIsAandacht(","function fbFilterItems(","function renderTabs(","function renderQueue(","function fbRowHtml(","function fbShortTime(",
   "function renderFocus(","function fbMetricsHtml(","function fbMin2hms(","function fbBerichtMbHtml(","function fbMasterbreinBullets(",
   "function fbApplyContext(","function fbWeekSelHtml(","function fbWeekChartHtml(","function fbCtxColSkeleton(","function fbCtxColEmpty(","function fbCtxColHtml(","function fbRing(",
   "function fbHeadHtml(","function fbDockHtml(","function fbPaHtml(","function fbThreadHtml(","function fbCtxHtml("].forEach(f=>code+=sliceFn(t,f)+"\n");
  code+="\nwindow.__fb={renderQueue,renderFocus,fbApplyContext};";
  (0,eval)(code);
}

// ── FB state + realistische data (vorm = queue/detail/cockpit/week payloads) ──
const FB={items:[],filter:"wachten",selId:null,detailCache:{},ctxCache:{},summaryLog:[],groups:[],group:"alle"};
const SAMPLE={today:"2026-08-30",draft:"Goed gedaan deze week Masja! Mooie duurprikkel. Let op je linker kuit — houd het de komende dagen in de gaten en meld het als het verergert. We bouwen rustig verder."};
const QUEUE=[
 {id:"w-masja",athlete_key:"masja",naam:"Masja Bolk",voornaam:"Masja",datum:"2026-08-30",athlete_ts:"2026-08-30T08:23:00",workout:"Lange duurloop 16 km",categorie:"reactie",preview:"laatste 3 km zwaar in kuit",groep:"comfort",groep_label:"Comfort"},
 {id:"w-linsy",athlete_key:"linsy",naam:"Linsy Hanegraaf",voornaam:"Linsy",datum:"2026-08-30",athlete_ts:"2026-08-30T08:22:00",workout:"2 van 3 trainingen gemist",categorie:"reactie",preview:"drukke week gehad",groep:"comfort",groep_label:"Comfort"},
 {id:"w-carmen",athlete_key:"carmen",naam:"Carmen Megens",voornaam:"Carmen",datum:"2026-08-29",athlete_ts:"2026-08-29T18:00:00",workout:"Herstelloop 5 km",categorie:"gevoel",preview:"",groep:"comfort",groep_label:"Comfort"},
 {id:"w-anouk",athlete_key:"anouk",naam:"Anouk Van son",voornaam:"Anouk",datum:"2026-08-30",athlete_ts:"2026-08-30T12:00:00",workout:"HYROX-specifiek 6x1km",categorie:"uitgevoerd",preview:"",groep:"performer",groep_label:"High Performer"},
 {id:"w-daan",athlete_key:"daan",naam:"Daan Minnema",voornaam:"Daan",datum:"2026-08-30",athlete_ts:"2026-08-30T09:00:00",workout:"Progressieve duurloop 14 km",categorie:"gevoel",preview:"",groep:"performer",groep_label:"High Performer"},
 {id:"w-iris",athlete_key:"iris",naam:"Iris Van Schaijk",voornaam:"Iris",datum:"2026-08-29",athlete_ts:"2026-08-29T20:00:00",workout:"Kracht + intervallen",categorie:"reactie",preview:"benen voelden zwaar",groep:"start",groep_label:"Start to Run"},
 {id:"w-jelle",athlete_key:"jelle",naam:"Jelle Verhoeven",voornaam:"Jelle",datum:"2026-08-29",athlete_ts:"2026-08-29T19:00:00",workout:"Tempoloop 10 km",categorie:"uitgevoerd",preview:"",groep:"start",groep_label:"Start to Run"},
 {id:"w-noa",athlete_key:"noa",naam:"Noa Prins",voornaam:"Noa",datum:"2026-08-29",athlete_ts:"2026-08-29T16:00:00",workout:"Duurloop 12 km",categorie:"gevoel",preview:"",groep:"comfort",groep_label:"Comfort"},
 {id:"w-sven",athlete_key:"sven",naam:"Sven de Wit",voornaam:"Sven",datum:"2026-08-28",athlete_ts:"2026-08-28T21:00:00",workout:"Interval 8x400m",categorie:"reactie",preview:"hamstring wat strak",groep:"performer",groep_label:"High Performer"},
];
const DETAIL_MASJA={ok:true,id:"w-masja",naam:"Masja Bolk",voornaam:"Masja",workout:"Lange duurloop 16 km",datum:"2026-08-30",categorie:"reactie",workout_type:"run",is_run:true,
  gepland:{km:16,min:96,zone:{num:2,naam:"Duur"}},uitgevoerd:{km:16.2,min:98,pace:"5:14",hr_avg:148,hr_max:162,zone:{num:2}},
  afwijking:{pct:1,relevance:"ignore"},gevoel:{label:"Redelijk"},rpe:"5.1",is_structured:false,plan_is_kern:false,
  gesprek:[{coach:false,wie:"Masja",tekst:"Voelde me goed tijdens de run, maar laatste 3 km werd het zwaar in mijn linker kuit. Verder geen pijntjes."}]};
const COCKPIT_MASJA={ok:true,key:"masja",naam:"Masja Bolk",groep:"Comfort",
  status:{overall:"ATTENTION",reliability:{level:"amber",stale:true,core_gap:false}},
  attention:[{kind:"load_signal",title:"Verhoogd belastingssignaal",why:"volume +202% t.o.v. referentie"},
    {kind:"complaint",title:"Klacht: kuit links",why:"gevoelig na lange duurloop"}],
  load_observation:{ernst:"hoog",signalen:"volumesprong; kuitgevoeligheid",delta_pct:202,datum:"2026-08-29"},
  planning:{rows:[{label:"Hoofddoel",value:"7-Heuvelenloop"},{label:"Wedstrijddatum",value:"2026-10-05"},{label:"Race-prioriteit",value:"hoog"},{label:"Schema-status",value:"loopt — nog 12 dagen"}]},
  domains:[{key:"coach",titel:"Coachkennis",onbekend:false,regels:[{value:"Reageert goed op rustige opbouw"},{value:"Kuit links gevoelig bij hoge belasting"},{value:"Slaapt gemiddeld 7u 12m"}]}],
  source_health:[{source:"Trainingslog",available:true,stale:false},{source:"Intake",available:true,stale:false},{source:"Garmin-herstel",available:true,stale:true}]};
const WEEK_MASJA={ok:true,week:35,maandag:"2026-08-24",zondag:"2026-08-30",range_label:"ma 24 aug – zo 30 aug",weekvolume_km:48.4,totale_duur:"2:57:36",gem_tempo:"5:14",
  dagen:[{dag:"ma",label:"ma 24",km:15.5,is_future:false},{dag:"di",label:"di 25",km:7.2,is_future:false},{dag:"wo",label:"wo 26",km:1.0,is_future:false},{dag:"do",label:"do 27",km:13.6,is_future:false},{dag:"vr",label:"vr 28",km:2.0,is_future:false},{dag:"za",label:"za 29",km:9.1,is_future:false},{dag:"zo",label:"zo 30",km:0,is_future:false}]};

function buildDom(){
  const p=new URLSearchParams(location.search);
  const cw=p.get("cw");
  const frame=document.createElement("div");frame.className="frame";if(cw)frame.style.maxWidth=(+cw+60)+"px";
  frame.innerHTML=`<section class="view ds-view fb-cockpit on" data-view="feedback" style="display:block">
    <header class="fb-top"><div><h1>Feedback</h1><p>Analyseer trainingen, geef feedback en stuur bij.</p></div>
      <div class="fb-top-acts"><button class="fb-dbg-btn" id="fb-dbg">Debug</button><button class="iconbtn" id="fb-refresh"><svg class="ic"><use href="#ic-refresh"/></svg></button></div></header>
    <div class="fb-grid">
      <div class="fb-queue-col pane"><div class="fbq-head"><span class="fbq-title">Wachten op feedback <span class="fbq-count" id="fb-count">–</span></span>
        <button class="fbq-hicon" id="fb-refresh2"><svg class="ic"><use href="#ic-refresh"/></svg></button></div>
        <div class="fbq-tabs" id="fb-tabs"></div><div class="fb-groups" id="fb-groups" hidden></div><button class="fb-nieuw" id="fb-nieuw" hidden></button>
        <p class="hint" id="fb-info" hidden></p><section id="fb-queue" class="fb-queue" tabindex="0"></section></div>
      <div class="fb-focus-col on" id="fb-focus-col"><div id="fb-focus" class="fb-focus pane"></div></div>
      <aside class="fb-ctx-col" id="fb-ctx-col"></aside>
    </div></section>`;
  $("#mount").appendChild(frame);
}
async function run(){
  await Promise.all([loadSprite(),loadFns()]);
  buildDom();
  const p=new URLSearchParams(location.search);
  FB.filter=p.get("filter")||"wachten";
  FB.items=QUEUE.slice();
  FB.detailCache["w-masja"]=DETAIL_MASJA;
  const sel = p.get("empty")? null : (p.get("sel")||"w-masja");
  FB.selId=sel;
  window.__fb.renderQueue();
  $$(".fbq-row").forEach(r=>r.addEventListener("click",()=>{FB.selId=r.dataset.q||r.getAttribute("data-id");window.__fb.renderQueue();}));
  const calm = !!p.get("calm");
  const DET = calm ? {...DETAIL_MASJA, id:"w-carmen", naam:"Carmen Megens", voornaam:"Carmen", workout:"Herstelloop 5 km", categorie:"gevoel",
      uitgevoerd:{km:5.1,min:31,pace:"6:05",hr_avg:132,zone:{num:1}}, rpe:"3.2", gevoel:{label:"Goed"},
      gesprek:[{coach:false,wie:"Carmen",tekst:"Lekker rustig gelopen, voelde fris. Geen klachten."}]} : DETAIL_MASJA;
  const CK = calm ? {ok:true,naam:"Carmen Megens",status:{overall:"GOOD",reliability:{level:"green",stale:false}},attention:[],load_observation:null,
      planning:{rows:[{label:"Hoofddoel",value:"10 km PR"},{label:"Wedstrijddatum",value:"2026-11-09"}]},
      domains:[{key:"coach",titel:"Coachkennis",onbekend:false,regels:[{value:"Consistent, luistert goed naar het lichaam"},{value:"Herstelt snel"}]}],
      source_health:[{source:"Trainingslog",available:true,stale:false},{source:"Intake",available:true,stale:false}]} : COCKPIT_MASJA;
  const WK = calm ? {...WEEK_MASJA,weekvolume_km:28.6,dagen:[{dag:"ma",label:"ma 24",km:6,is_future:false},{dag:"di",label:"di 25",km:0,is_future:false},{dag:"wo",label:"wo 26",km:8.5,is_future:false},{dag:"do",label:"do 27",km:0,is_future:false},{dag:"vr",label:"vr 28",km:5.1,is_future:false},{dag:"za",label:"za 29",km:9,is_future:false},{dag:"zo",label:"zo 30",km:0,is_future:false}]} : WEEK_MASJA;
  if(calm){ FB.selId="w-carmen"; FB.detailCache["w-carmen"]=DET; }
  if(sel){ window.__fb.renderFocus(DET); window.__fb.fbApplyContext(CK, WK, DET); }
  else { $("#fb-focus").innerHTML=`<div class="fb-focus-empty">${ic("message")}<p>Kies links een training om te beoordelen.</p></div>`; $("#fb-ctx-col").innerHTML=""; }
  $("#hl").style.display=p.get("hidelbl")?"none":"block";
  $("#hl").textContent=`w=${innerWidth} · feedback`;
}
run().catch(e=>{$("#hl").textContent="FOUT: "+e.message;console.error(e);});
</script>
</body>
</html>
