<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feedback · Coachtriage-cockpit (design-lab)</title>
<style>
/* ─────────────────────────────────────────────────────────────────────────
   DESIGN-LAB — FEEDBACK COACHTRIAGE-COCKPIT (3-zone werkscherm)
   Benchmark = BEBETTER-FEEDBACK-COACHTRIAGE-NORTHSTAR-v1.png. Operationeel
   coach-scherm voor ±30 open feedback-items:
   LINKS  = WACHTRIJ / triage (scanbaar, filter-tabs, urgentie, status);
   MIDDEN = GESELECTEERDE CASE (hero-beslissingspaneel: metrics · atleetbericht ·
            Masterbrein-duiding · weekoverzicht ma–zo · concept-terugkoppeling · CTA's);
   RECHTS = CONTEXT & MASTERBREIN (belasting/trend · klachten · doel/planning ·
            coachkennis · bronnen).
   Week-logica = kalenderweek ma–zo. Zelfde premium familie als Workspace/Dossier.
   Alléén echte data / bestaande projecties; eerlijke lege-staat.
   ───────────────────────────────────────────────────────────────────────── */
@font-face{font-family:"Space Grotesk";src:url(/pwa/static/fonts/sg-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Space Grotesk";src:url(/pwa/static/fonts/sg-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Space Grotesk";src:url(/pwa/static/fonts/sg-700.woff2) format("woff2");font-weight:700;font-display:swap}
:root{
  --ds-canvas:#081527;--ds-text:#EAF2FF;--ds-text-2:#B4C7E6;--ds-text-3:#7F97BC;
  --ds-accent:#5EE6EB;--ds-accent-soft:rgba(94,230,235,.12);
  --ds-calm:#5EE6EB;--ds-calm-bg:rgba(94,230,235,.10);--ds-calm-bd:rgba(94,230,235,.36);
  --ds-attention:#F0A62B;--ds-attention-bg:rgba(240,166,43,.12);--ds-attention-bd:rgba(240,166,43,.46);
  --ds-critical:#F4744C;--ds-critical-bg:rgba(244,116,76,.14);--ds-critical-bd:rgba(244,116,76,.50);
  --ds-success:#37D9A2;--ds-success-bg:rgba(55,217,162,.10);--ds-success-bd:rgba(55,217,162,.38);
  --ds-stale:#8098BC;--ds-stale-bg:rgba(128,152,188,.10);--ds-stale-bd:rgba(128,152,188,.34);
  --ds-1:4px;--ds-2:8px;--ds-3:12px;--ds-4:16px;--ds-5:20px;--ds-6:24px;--ds-8:32px;--ds-10:40px;
  --ds-r-sm:10px;--ds-r-md:14px;--ds-r-lg:18px;--ds-r-xl:22px;--ds-r-pill:999px;
  --ds-ease:cubic-bezier(.2,.7,.3,1);--ds-fast:120ms;--ds-base:200ms;
  --tone:var(--ds-calm);--tone-bg:var(--ds-calm-bg);--tone-bd:var(--ds-calm-bd);
}
.is-calm{--tone:var(--ds-calm);--tone-bg:var(--ds-calm-bg);--tone-bd:var(--ds-calm-bd)}
.is-attention{--tone:var(--ds-attention);--tone-bg:var(--ds-attention-bg);--tone-bd:var(--ds-attention-bd)}
.is-critical{--tone:var(--ds-critical);--tone-bg:var(--ds-critical-bg);--tone-bd:var(--ds-critical-bd)}
.is-success{--tone:var(--ds-success);--tone-bg:var(--ds-success-bg);--tone-bd:var(--ds-success-bd)}
.is-stale{--tone:var(--ds-stale);--tone-bg:var(--ds-stale-bg);--tone-bd:var(--ds-stale-bd)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(150% 100% at 50% -10%,#0b1f3d,#071129 58%,#03070f 100%),var(--ds-canvas);
  color:var(--ds-text);font-family:"Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  min-height:100vh;-webkit-font-smoothing:antialiased}
.ds-label{font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--ds-text-3);margin:0}
.ds-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:var(--ds-r-pill);
  font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--tone);
  background:var(--tone-bg);border:1px solid var(--tone-bd);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.av{border-radius:12px;flex:0 0 auto;display:grid;place-items:center;font-weight:700;letter-spacing:.02em;
  color:var(--tone);background:radial-gradient(circle at 50% 24%,var(--tone-bg),transparent 62%),rgba(10,26,52,.6);
  border:1px solid var(--tone-bd)}

/* ── Shell ─────────────────────────────────────────────────────────────── */
.fb{position:relative;width:1400px;max-width:100%;margin:0 auto;padding:20px 30px 22px}
.fb-env{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.fb-env .vig{position:absolute;inset:0;background:radial-gradient(120% 84% at 50% 30%,transparent 58%,rgba(3,7,15,.5) 100%)}
.fb>*{position:relative;z-index:1}

/* View header */
.fb-top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:16px}
.fb-top h1{margin:0;font-size:26px;font-weight:750;letter-spacing:-.02em}
.fb-top p{margin:3px 0 0;font-size:12.5px;color:var(--ds-text-3)}
.fb-search{display:flex;align-items:center;gap:9px;width:320px;max-width:34vw;padding:10px 15px;border-radius:12px;
  background:rgba(10,24,46,.55);border:1px solid rgba(122,168,255,.16);color:var(--ds-text-3);font-size:13px}
.fb-search svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;flex:0 0 auto}

/* 3-zone grid */
.fb-grid{display:grid;gap:16px;align-items:start;
  grid-template-columns:minmax(300px,344px) minmax(0,1.42fr) minmax(300px,364px)}
.pane{position:relative;border-radius:var(--ds-r-xl);
  background:linear-gradient(162deg,rgba(22,45,86,.4),rgba(10,23,45,.28) 62%,rgba(8,18,38,.16));
  border:1px solid rgba(122,168,255,.12);
  -webkit-backdrop-filter:blur(12px) saturate(1.04);backdrop-filter:blur(12px) saturate(1.04);
  box-shadow:inset 0 1px 0 rgba(192,217,255,.06),0 24px 54px -38px rgba(2,8,20,.9)}

/* ── LINKS: WACHTRIJ ────────────────────────────────────────────────────── */
.q-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 16px 10px}
.q-head .qt{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ds-text-2)}
.q-head .qn{color:var(--ds-accent);font-weight:700}.q-head .qn i{color:var(--ds-text-3);font-style:normal;font-weight:600}
.q-head .qicon{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--ds-text-3);
  background:rgba(94,230,235,.07);border:1px solid rgba(122,168,255,.14)}
.q-head .qicon svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8}
.q-search{display:flex;align-items:center;gap:9px;margin:0 14px 10px;padding:9px 13px;border-radius:11px;
  background:rgba(6,16,34,.5);border:1px solid rgba(122,168,255,.13);color:var(--ds-text-3);font-size:12.5px}
.q-search svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8}
.q-search .flt{margin-left:auto;color:var(--ds-text-3)}
.q-tabs{display:flex;gap:6px;padding:0 14px 12px;flex-wrap:wrap}
.q-tab{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:var(--ds-r-pill);cursor:pointer;
  font:inherit;font-size:11px;font-weight:600;color:var(--ds-text-3);background:rgba(10,24,46,.4);border:1px solid rgba(122,168,255,.1)}
.q-tab .c{font-size:10px;font-weight:700;padding:1px 6px;border-radius:var(--ds-r-pill);background:rgba(122,168,255,.14);color:var(--ds-text-2)}
.q-tab.on{color:var(--ds-canvas);background:var(--ds-accent);border-color:transparent}
.q-tab.on .c{background:rgba(8,18,38,.28);color:var(--ds-canvas)}
.q-tab.att.on{background:var(--ds-attention)}
.q-list{padding:0 10px 8px;max-height:660px;overflow:auto;scrollbar-width:thin}
.q-group{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ds-text-3);padding:10px 6px 6px}
.q-item{position:relative;display:grid;grid-template-columns:44px 1fr auto;gap:11px;align-items:center;width:100%;text-align:left;
  font:inherit;color:inherit;cursor:pointer;padding:11px 10px;border-radius:14px;border:1px solid transparent;background:none;
  transition:background var(--ds-fast) var(--ds-ease),border-color var(--ds-fast) var(--ds-ease)}
.q-item .qav{width:44px;height:44px;font-size:14px;position:relative}
.q-item .qav .dot{position:absolute;top:-2px;right:-2px;width:11px;height:11px;border-radius:50%;
  border:2px solid var(--ds-canvas);background:var(--tone)}
.q-item .qb{min-width:0;display:flex;flex-direction:column;gap:2px}
.q-item .qn2{display:block;font-size:14px;font-weight:650;color:var(--ds-text);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-item .qtr{font-size:12px;color:var(--ds-text-2);line-height:1.3;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q-item .qwk{font-size:11px;color:var(--ds-text-3);margin-top:2px}
.q-item .qr{text-align:right;align-self:start;flex:0 0 auto}
.q-item .qtime{display:block;font-size:11px;color:var(--ds-text-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.q-item .qstat{display:block;margin-top:7px;font-size:10px;font-weight:700;letter-spacing:.02em}
.q-item .qstat.wacht{color:var(--ds-accent)}.q-item .qstat.done{color:var(--ds-success)}
.q-item:hover{background:rgba(94,230,235,.04)}
.q-item.sel{background:linear-gradient(180deg,rgba(94,230,235,.1),rgba(10,24,46,.25));border-color:var(--ds-calm-bd);
  box-shadow:0 0 0 1px var(--ds-calm-bd),0 12px 30px -20px var(--ds-accent)}
.q-item.sel .qn2{color:#fff}
.q-item:focus-visible{outline:2px solid var(--ds-accent);outline-offset:2px}
.q-more{display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 14px 12px;padding:11px;border-radius:12px;
  cursor:pointer;font:inherit;font-size:12px;font-weight:600;color:var(--ds-text-2);background:rgba(10,24,46,.4);border:1px solid rgba(122,168,255,.12)}
.q-more svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8}

/* ── MIDDEN: GESELECTEERDE CASE ─────────────────────────────────────────── */
.case{padding:0}
.case-h{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:17px 20px 14px;border-bottom:1px solid rgba(255,255,255,.05)}
.case-id{display:flex;align-items:center;gap:13px;min-width:0}
.case-id .cav{width:48px;height:48px;font-size:15px;position:relative}
.case-id .cav .dot{position:absolute;top:-2px;right:-2px;width:12px;height:12px;border-radius:50%;border:2px solid var(--ds-canvas);background:var(--tone)}
.case-id h2{margin:0;font-size:20px;font-weight:750;letter-spacing:-.02em;line-height:1.1;display:flex;align-items:center;gap:9px}
.case-id .sub{font-size:12px;color:var(--ds-text-3);margin-top:3px;display:flex;align-items:center;gap:8px}
.case-tr{text-align:right;flex:0 0 auto}
.case-tr .trn{display:flex;align-items:center;gap:8px;justify-content:flex-end;font-size:14px;font-weight:650;color:var(--ds-text)}
.case-tr .trn svg{width:17px;height:17px;fill:none;stroke:var(--ds-accent);stroke-width:1.7}
.case-tr .trd{font-size:11.5px;color:var(--ds-text-3);margin-top:3px}
.case-body{padding:14px 20px 18px}
/* week selector */
.wk-sel{display:inline-flex;align-items:center;gap:11px;padding:8px 12px;border-radius:11px;margin-bottom:14px;
  background:rgba(10,24,46,.5);border:1px solid rgba(122,168,255,.14)}
.wk-sel .wc{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:var(--ds-text-3);background:rgba(94,230,235,.07)}
.wk-sel .wc svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8}
.wk-sel b{font-size:13px;font-weight:650}.wk-sel .wr{font-size:12px;color:var(--ds-text-3)}
.wk-sel .nav{display:flex;gap:4px;margin-left:6px}
.wk-sel .nav button{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;cursor:pointer;color:var(--ds-text-2);
  background:rgba(94,230,235,.06);border:1px solid rgba(122,168,255,.14)}
.wk-sel .nav button svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2}
/* metrics */
.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;border-radius:14px;overflow:hidden;
  background:rgba(122,168,255,.08);border:1px solid rgba(122,168,255,.1);margin-bottom:16px}
.metric{padding:13px 15px;background:linear-gradient(180deg,rgba(14,30,58,.6),rgba(9,20,40,.5))}
.metric b{display:block;font-size:20px;font-weight:750;letter-spacing:-.02em;line-height:1}
.metric b i{font-size:12px;font-weight:600;font-style:normal;color:var(--ds-text-3);margin-left:2px}
.metric small{display:block;font-size:10.5px;color:var(--ds-text-3);margin-top:5px}
.metric.hot b{color:var(--ds-critical)}
/* two panels */
.case-2col{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.subpanel{padding:14px 16px;border-radius:14px;background:rgba(8,18,38,.4);border:1px solid rgba(122,168,255,.1)}
.subpanel .sh{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ds-text-3);margin-bottom:9px}
.subpanel .sh svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8}
.subpanel .sh .q{margin-left:auto;color:var(--ds-text-3);opacity:.5}
.subpanel .sh .q svg{width:16px;height:16px}
.bericht{font-size:13px;color:var(--ds-text-2);line-height:1.55}
.bericht .meta{font-size:11px;color:var(--ds-text-3);margin-top:9px}
.mb-list{margin:0;padding:0;list-style:none;display:grid;gap:7px}
.mb-list li{font-size:12.5px;color:var(--ds-text-2);line-height:1.4;padding-left:15px;position:relative}
.mb-list li::before{content:"";position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%;background:var(--ds-attention)}
.mb-list li.ok::before{background:var(--ds-success)}
/* weekoverzicht chart */
.wk-chart{padding:15px 16px;border-radius:14px;background:rgba(8,18,38,.4);border:1px solid rgba(122,168,255,.1);margin-bottom:16px}
.wk-chart .ch{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.wk-chart .ch b{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ds-text-3)}
.wk-chart .leg{display:flex;gap:14px;margin-left:6px;font-size:10.5px;color:var(--ds-text-3)}
.wk-chart .leg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.wk-chart .leg .v{background:var(--ds-accent)}.wk-chart .leg .b{background:var(--ds-critical);border-radius:50%}
.wk-chart .badge{margin-left:auto;font-size:10px;font-weight:700;color:var(--ds-critical);padding:3px 9px;border-radius:var(--ds-r-pill);
  background:var(--ds-critical-bg);border:1px solid var(--ds-critical-bd)}
.wk-chart .ch svg{width:15px;height:15px;flex:0 0 auto;fill:none;stroke:var(--ds-text-3);stroke-width:1.8}
.wk-chart>svg{width:100%;height:150px;display:block}
/* concept terugkoppeling */
.reply{border-radius:14px;background:rgba(8,18,38,.45);border:1px solid rgba(122,168,255,.14);overflow:hidden}
.reply .rh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 15px 8px}
.reply .rh b{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ds-text-3)}
.reply .rh .draft{font-size:9.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--ds-attention);
  padding:3px 9px;border-radius:var(--ds-r-pill);background:var(--ds-attention-bg);border:1px solid var(--ds-attention-bd)}
.reply .rtext{padding:2px 15px 12px;font-size:13.5px;color:var(--ds-text);line-height:1.55;min-height:78px}
.reply .rtext em{color:var(--ds-text-2)}
.reply .rbar{display:flex;align-items:center;gap:4px;padding:9px 13px;border-top:1px solid rgba(255,255,255,.05)}
.reply .rbar button{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--ds-text-3);
  background:none;border:0;font-weight:700}
.reply .rbar button:hover{color:var(--ds-text);background:rgba(94,230,235,.08)}
.reply .rbar button svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8}
.reply .rbar .cnt{margin-left:auto;font-size:11px;color:var(--ds-text-3);font-variant-numeric:tabular-nums}
/* CTA row */
.cta-row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.cta{display:inline-flex;align-items:center;gap:9px;padding:12px 18px;border-radius:12px;cursor:pointer;font:inherit;
  font-size:13px;font-weight:650;color:var(--ds-text);background:rgba(10,24,46,.5);border:1px solid rgba(122,168,255,.16)}
.cta svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8}
.cta.primary{color:var(--ds-canvas);background:linear-gradient(180deg,#6ff0f4,var(--ds-accent));border-color:transparent;
  box-shadow:0 12px 30px -12px var(--ds-accent)}
.cta:hover{border-color:var(--ds-accent)}.cta.primary:hover{filter:brightness(1.05)}

/* ── RECHTS: CONTEXT & MASTERBREIN ──────────────────────────────────────── */
.ctx{display:flex;flex-direction:column;gap:13px}
.ctx-h{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ds-text-2);padding:2px 2px 0}
.card{padding:15px 16px;border-radius:16px;background:linear-gradient(162deg,rgba(20,42,80,.4),rgba(10,23,45,.26));
  border:1px solid rgba(122,168,255,.12)}
.card .ch{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.card .ch .ci{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:var(--tone);background:var(--tone-bg);border:1px solid var(--tone-bd)}
.card .ch .ci svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8}
.card .ch b{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ds-text-2)}
.card .ch .det{margin-left:auto;font-size:11px;font-weight:600;color:var(--ds-accent);cursor:pointer}
/* belasting ring */
.bel{display:flex;align-items:center;gap:15px}
.bel .ring{width:88px;height:88px;flex:0 0 auto;position:relative}
.bel .ring b{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.bel .ring b span{font-size:19px;font-weight:750;color:var(--ds-critical)}
.bel .ring b small{display:block;font-size:9px;color:var(--ds-text-3);margin-top:1px}
.bel .bt{font-size:14px;font-weight:650;color:var(--ds-text);line-height:1.3}
.bel .bs{font-size:11.5px;color:var(--ds-text-3);margin-top:6px;line-height:1.5}
.bel .bs b{color:var(--ds-text-2);font-weight:600}
.bel .trend{color:var(--ds-critical)}
/* klacht */
.klacht .kt{font-size:14px;font-weight:650;color:var(--ds-text)}
.klacht .kr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:9px;font-size:12px;color:var(--ds-text-3)}
.klacht .scale{display:flex;gap:3px}.klacht .scale i{width:13px;height:5px;border-radius:2px;background:rgba(122,168,255,.2)}
.klacht .scale i.on{background:var(--ds-attention)}
.klacht .kr b{color:var(--ds-attention);font-weight:700}
.klacht .sig{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:11px;padding-top:10px;border-top:1px solid rgba(255,255,255,.05);font-size:11.5px;color:var(--ds-text-3)}
.klacht .sig .arw{color:var(--ds-text-3)}
/* doel */
.doel .dt{font-size:15px;font-weight:700;color:var(--ds-text);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.doel .dt .tag{font-size:8.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:2px 7px;border-radius:var(--ds-r-pill)}
.doel .dt .tag.h{color:var(--ds-success);background:var(--ds-success-bg);border:1px solid var(--ds-success-bd)}
.doel .dt .tag.p{color:var(--ds-accent);background:rgba(94,230,235,.1);border:1px solid var(--ds-calm-bd)}
.doel .dm{font-size:12px;color:var(--ds-text-3);margin-top:8px;line-height:1.6}
.doel .dm b{color:var(--ds-text-2);font-weight:600}
/* coachkennis */
.kennis{margin:0;padding:0;list-style:none;display:grid;gap:9px}
.kennis li{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;color:var(--ds-text-2);line-height:1.4}
.kennis li svg{width:15px;height:15px;flex:0 0 auto;margin-top:1px;fill:none;stroke:var(--ds-success);stroke-width:2}
/* bronnen */
.bronnen{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:11px;color:var(--ds-text-3);padding:2px}
.bronnen .upd{width:100%;display:flex;align-items:center;gap:7px;margin-bottom:4px;color:var(--ds-text-3)}
.bronnen .upd svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8}
.bronnen .src{display:inline-flex;align-items:center;gap:6px}
.bronnen .src svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.8;opacity:.7}

/* lab nav */
.lab-nav{position:fixed;bottom:10px;left:10px;z-index:60;display:flex;gap:6px;padding:5px;border-radius:var(--ds-r-pill);
  background:rgba(6,14,30,.85);border:1px solid rgba(122,168,255,.2)}
.lab-nav a{font-size:11px;color:var(--ds-text-3);text-decoration:none;padding:6px 12px;border-radius:var(--ds-r-pill)}
.lab-nav a.on{color:var(--ds-canvas);background:var(--ds-accent);font-weight:700}

@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pane{animation:fadein .5s var(--ds-ease) both}
.fb-grid>*:nth-child(2){animation-delay:.05s}.fb-grid>*:nth-child(3){animation-delay:.1s}
@media (prefers-reduced-motion:reduce){.pane{animation:none}}

function ring(pct,tone){
  const col=toneHex[tone]||"#F4744C";
  const frac=Math.min(1,Math.abs(parseInt(pct))/300||.67);
  const r=39,c=2*Math.PI*r,off=c*(1-frac);
  return `<svg viewBox="0 0 88 88"><circle cx="44" cy="44" r="${r}" fill="none" stroke="rgba(122,168,255,.14)" stroke-width="6"/>
    <circle cx="44" cy="44" r="${r}" fill="none" stroke="${col}" stroke-width="6" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 44 44)" style="filter:drop-shadow(0 0 6px ${col})"/></svg>`;
}
function weekChart(c){
  const W=560,H=150,padL=8,padR=34,padB=22,padT=8;
  const iw=W-padL-padR, ih=H-padT-padB, n=c.days.length;
  const maxVol=Math.max(...c.vol,1)*1.15;
  const bw=iw/n*0.5;
  let bars="",line="",dots="",axis="",labels="";
  // belasting as % (right axis 0-300)
  const belY=v=>padT+ih-(Math.min(v,300)/300)*ih;
  const volY=v=>padT+ih-(v/maxVol)*ih;
  c.days.forEach((d,i)=>{
    const cx=padL+iw*(i+0.5)/n;
    const h=Math.max(2,(c.vol[i]/maxVol)*ih);
    const proj=(i===c.volProjected);
    bars+=`<rect x="${cx-bw/2}" y="${padT+ih-h}" width="${bw}" height="${h}" rx="3"
      fill="${proj?'none':'url(#volg)'}" stroke="${proj?'rgba(94,230,235,.5)':'none'}" stroke-dasharray="${proj?'3 3':'0'}"/>`;
    const by=belY(c.bel[i]);
    dots+=`<circle cx="${cx}" cy="${by}" r="2.6" fill="#F4744C"/>`;
    line+=(i?'L':'M')+cx+' '+by+' ';
    labels+=`<text x="${cx}" y="${H-6}" text-anchor="middle" font-size="10" fill="#7F97BC">${d.split(' ')[0].toUpperCase()} ${d.split(' ')[1]}</text>`;
  });
  [0,100,200,300].forEach(v=>{const y=belY(v);axis+=`<text x="${W-padR+6}" y="${y+3}" font-size="9" fill="#7F97BC">${v}%</text>
    <line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="rgba(122,168,255,.06)"/>`;});
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:150px">
    <defs><linearGradient id="volg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5EE6EB" stop-opacity=".85"/><stop offset="1" stop-color="#5EE6EB" stop-opacity=".35"/></linearGradient></defs>
    ${axis}${bars}<path d="${line}" fill="none" stroke="#F4744C" stroke-width="2" stroke-dasharray="1 4" stroke-linecap="round"/>${dots}${labels}</svg>`;
}

function queueRow(it,selId){
  const done=it.status==="done";
  return `<button type="button" class="q-item ${it.tone} ${it.id===selId?'sel':''}" data-q="${it.id}">
    <span class="av qav">${it.ini}${it.att?'<span class="dot"></span>':''}</span>
    <span class="qb"><span class="qn2">${it.naam}</span><span class="qtr">${it.tr}</span><span class="qwk">${it.wk}${it.rpe?` · RPE ${it.rpe}`:''}</span></span>
    <span class="qr"><span class="qtime">${it.time}</span><span class="qstat ${done?'done':'wacht'}">${done?'Afgerond':'Wachten'}</span></span>
  </button>`;
}

function renderQueue(selId,filter){
  const counts={wachten:QUEUE.filter(q=>q.status==='wachten').length,vandaag:QUEUE.filter(q=>q.group==='vandaag').length,

  let items=QUEUE;
  if(filter==='wachten') items=QUEUE.filter(q=>q.status==='wachten');
  else if(filter==='vandaag') items=QUEUE.filter(q=>q.group==='vandaag');
  else if(filter==='aandacht') items=QUEUE.filter(q=>q.att);
  else if(filter==='afgerond') items=QUEUE.filter(q=>q.status==='done');
  const tabs=[['wachten','Wachten',counts.wachten],['vandaag','Vandaag',counts.vandaag],['aandacht','Aandacht',counts.aandacht,'att'],['afgerond','Afgerond',counts.afgerond]];
  let list="",lastG="";
  items.forEach(it=>{ if(it.group!==lastG){ list+=`<div class="q-group">${it.group==='vandaag'?'Vandaag':it.group}</div>`; lastG=it.group; } list+=queueRow(it,selId); });
  return `<div class="pane">
    <div class="q-head"><span class="qt">Wachten op feedback <span class="qn">${counts.wachten}<i> / 30</i></span></span>
      <span class="qicon">${svg('run')}</span></div>

    <div class="q-list">${list}</div>
    <button type="button" class="q-more">Meer laden ${svg('chevD')}</button>
  </div>`;
}

        <div class="sig"><span>Laatste signaal</span><span>${x.klacht.sig} <span class="arw">›</span></span></div></div></div>
    <div class="card is-calm"><div class="ch"><span class="ci">${svg('flag')}</span><b>Doel &amp; planning</b><span class="det">Details</span></div>
      <div class="doel"><div class="dt">${x.doel.naam} ${x.doel.tags.map(t=>`<span class="tag ${t[1]}">${t[0]}</span>`).join('')}</div>
        <div class="dm">${x.doel.datum}<br><b>${x.doel.target}</b></div></div></div>
    <div class="card is-calm"><div class="ch"><span class="ci">${svg('brain')}</span><b>Coachkennis</b><span class="det">Details</span></div>
      <ul class="kennis">${x.kennis.map(k=>`<li>${svg('check')} ${k}</li>`).join('')}</ul></div>
    <div class="card" style="padding:13px 16px"><div class="bronnen"><span class="upd">${svg('clock')} Laatste update: ${x.bronnen.upd}</span>
      ${x.bronnen.items.map(b=>`<span class="src">${svg(b[1])} ${b[0]}</span>`).join('')}</div></div>
  </div>`;
}

let curSel="masja", curFilter="wachten";
function build(state){
  const selId = state==="attention" ? "sven" : curSel;
  const c=CASES[selId]||CASES.masja;
  const empty = state==="empty";
  const grid = empty
    ? `<div class="fb-grid"><div>${renderQueueEmpty()}</div>${renderCaseEmpty()}<div>${emptyCtx()}</div></div>`
    : `<div class="fb-grid">
        <div id="fb-queue">${renderQueue(selId,curFilter)}</div>
        <div id="fb-case">${renderCase(c)}</div>
        <div id="fb-ctx">${renderCtx(c)}</div></div>`;
  return `<div class="fb">
    <div class="fb-env"><div class="vig"></div></div>
    <header class="fb-top"><div><h1>Feedback</h1><p>Analyseer trainingen, geef feedback en stuur bij.</p></div>
      <div class="fb-search">${svg('search')}<span>Zoek atleet, training of bericht…</span></div></header>
    ${grid}
  </div>`;
}
function renderQueueEmpty(){
  return `<div class="pane"><div class="q-head"><span class="qt">Wachten op feedback <span class="qn">0<i> / 30</i></span></span><span class="qicon">${svg('run')}</span></div>
    <div class="q-tabs"><button class="q-tab on">Wachten <span class="c">0</span></button><button class="q-tab">Vandaag <span class="c">0</span></button><button class="q-tab att">Aandacht <span class="c">0</span></button><button class="q-tab">Afgerond <span class="c">18</span></button></div>
    <div style="padding:40px 20px;text-align:center;color:var(--ds-text-3)"><div style="width:52px;height:52px;margin:0 auto 14px;border-radius:14px;display:grid;place-items:center;color:var(--ds-success);background:var(--ds-success-bg);border:1px solid var(--ds-success-bd)">${svg('checkc')}</div>
      <div style="font-size:15px;font-weight:650;color:var(--ds-text)">Wachtrij leeg</div>
      <p style="font-size:12.5px;line-height:1.55;margin:8px 0 0">Alle openstaande feedback is afgehandeld. Nieuwe check-ins verschijnen hier zodra atleten trainingen loggen.</p></div></div>`;
}
function renderCaseEmpty(){
  return `<div id="fb-case"><div class="pane" style="min-height:520px;display:grid;place-items:center;text-align:center;padding:40px">
    <div><div style="width:56px;height:56px;margin:0 auto 16px;border-radius:15px;display:grid;place-items:center;color:var(--ds-text-3);background:rgba(94,230,235,.06);border:1px solid rgba(122,168,255,.14)">${svg('brain')}</div>
    <div style="font-size:17px;font-weight:700">Geen case geselecteerd</div>
    <p style="font-size:13px;color:var(--ds-text-3);max-width:340px;margin:10px auto 0;line-height:1.55">Kies links een atleet uit de wachtrij om de training, het Masterbrein-oordeel en je terugkoppeling te openen.</p></div></div></div>`;
}
function emptyCtx(){ return `<div class="ctx"><div class="ctx-h">Context &amp; Masterbrein</div>
  <div class="card" style="text-align:center;color:var(--ds-text-3);padding:26px 16px;font-size:12.5px;line-height:1.55">Context verschijnt hier zodra je een case selecteert.</div></div>`; }

function buildMobile(){
  const c=CASES.masja;
  const metrics=c.metrics.slice(0,3).concat([c.metrics[4]]).slice(0,3);
  const mm=[c.metrics[0],c.metrics[3],c.metrics[4]].map(m=>`<div class="mmetric ${m.hot?'hot':''}"><b>${m.v}${m.u?`<i style="font-size:10px;color:var(--ds-text-3)">${m.u}</i>`:''}</b><small>${m.l}</small></div>`).join('');
  return `<div class="fb ${c.tone}"><div class="fbm">
    <h1>Feedback</h1><div class="sub">6 wachten · 3 aandacht · Week 35</div>
    <div class="mtabs"><button class="q-tab on">Wachten <span class="c">6</span></button><button class="q-tab">Vandaag <span class="c">5</span></button><button class="q-tab att">Aandacht <span class="c">3</span></button><button class="q-tab">Afgerond <span class="c">3</span></button></div>
    <div class="mcase ${c.tone}">
      <div class="mch"><span class="av">${c.ini}<span style="position:absolute;top:-2px;right:-2px;width:11px;height:11px;border-radius:50%;border:2px solid var(--ds-canvas);background:var(--tone)"></span></span>
        <div><h2>${c.naam}</h2><div class="s">${c.tr} <span class="ds-chip ${c.tone}">${c.att}</span></div></div>
        <span class="back">${svg('chevL')} Wachtrij</span></div>
      <div class="mbody">
        <div class="wk-sel" style="margin-bottom:12px"><span class="wc">${svg('cal')}</span><b>${c.week}</b><span class="wr">· ${c.wkrange}</span></div>
        <div class="mmetrics">${mm}</div>
        <div class="msec"><div class="subpanel"><div class="sh">${svg('brain')} Masterbrein samenvatting</div><ul class="mb-list">${c.mb.map(m=>`<li>${m.t}</li>`).join('')}</ul></div></div>
        <div class="msec"><div class="wk-chart" style="margin:0"><div class="ch"><b>Weekoverzicht</b><span class="badge" style="margin-left:auto">+202% vs ref</span></div>${weekChart(c)}</div></div>
        <div class="reply"><div class="rh"><b>Concept terugkoppeling</b><span class="draft">Concept</span></div><div class="rtext">${c.reply}</div>
          <div class="rbar"><button>${svg('bold')}</button><button>${svg('ital')}</button><button>${svg('emoji')}</button><span class="cnt">${c.reply.length}/600</span></div></div>
        <div class="cta-row" style="margin-top:14px"><button class="cta primary" style="flex:1;justify-content:center">${svg('send')} Feedback sturen</button><button class="cta">${svg('checkc')}</button></div>
      </div>
    </div>
    <div class="ctx">${renderCtx(c).replace('<div class="ctx">','').replace(/<\/div>\s*$/,'')}</div>
  </div></div>`;
}
function render(){
  const h=(location.hash||"#queue").slice(1);
  const state=["queue","attention","empty","mobile"].includes(h)?h:"queue";
  if(state==="attention") curSel="sven"; else if(state==="queue") curSel="masja";
  document.querySelectorAll(".lab-nav a").forEach(a=>a.classList.toggle("on",a.dataset.b===state));
  if(state==="mobile"){ document.getElementById("root").innerHTML=buildMobile(); return; }
  document.getElementById("root").innerHTML=build(state);
  document.querySelectorAll(".lab-nav a").forEach(a=>a.classList.toggle("on",a.dataset.b===state));
  wire(state);
}
function wire(state){
  const root=document.getElementById("root");
  root.querySelectorAll("[data-q]").forEach(el=>el.addEventListener("click",()=>{curSel=el.dataset.q;refresh(state);}));
  root.querySelectorAll("[data-flt]").forEach(el=>el.addEventListener("click",()=>{curFilter=el.dataset.flt;refresh(state);}));
}
function refresh(state){
  const c=CASES[curSel]||CASES.masja;
  const q=document.getElementById("fb-queue"), cs=document.getElementById("fb-case"), cx=document.getElementById("fb-ctx");
  if(q) q.innerHTML=renderQueue(curSel,curFilter);
  if(cs&&CASES[curSel]) cs.innerHTML=renderCase(c);
  if(cx&&CASES[curSel]) cx.innerHTML=renderCtx(c);
  wire(state);
}
window.addEventListener("hashchange",render);
render();
</script>
</body>
</html>
